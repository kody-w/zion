// --- Render Stats ---
function renderStats(containerId, data, isOptimal) {
  const el = document.getElementById(containerId);
  const stats = [
    ['Final Gini', data.final_gini.toFixed(4), 'neutral'],
    ['Avg Balance', Math.round(data.avg_balance).toLocaleString() + ' ✦', 'neutral'],
    ['Total Spark', data.total_spark.toLocaleString() + ' ✦', 'neutral'],
    ['Treasury', data.treasury.toLocaleString() + ' ✦', 'neutral'],
  ];
  if (isOptimal) {
    const giniDelta = ((DATA.baseline.final_gini - data.final_gini) / DATA.baseline.final_gini * 100);
    stats.push(['Gini Improvement', giniDelta.toFixed(1) + '%', giniDelta > 0 ? 'good' : 'bad']);
  }
  el.innerHTML = stats.map(([label, value, cls]) =>
    `<div class="stat"><span class="label">${label}</span><span class="value ${cls}">${value}</span></div>`
  ).join('');
}

  for (let i = 0; i < maxLen; i++) {
    const b = bb[i] || ['-', '-', 0];
    const o = ob[i] || ['-', '-', 0];
    const bRange = b[1] === null ? `${b[0]}+` : `${b[0]}–${b[1]}`;
    const bRate = (b[2] * 100).toFixed(1) + '%';
    const oRate = (o[2] * 100).toFixed(1) + '%';
    const arrow = o[2] > b[2] ? '↑' : o[2] < b[2] ? '↓' : '=';
    const arrowColor = o[2] > b[2] ? '#f87171' : o[2] < b[2] ? '#4ade80' : '#888';
    html += `<tr>
      <td>${bRange} ✦</td>
      <td>${bRate}</td>
      <td style="text-align:center;color:${arrowColor};font-weight:bold">${arrow}</td>

// --- Distribution Chart (simulated from Gini) ---
// Generate approximate log-normal distributions matching each Gini
function generateDistribution(avgBalance, gini, n) {
  // Use Gini to estimate sigma of log-normal: Gini ≈ 2Φ(σ/√2)-1
  const sigma = Math.max(0.05, gini * 3);
  const mu = Math.log(avgBalance) - sigma * sigma / 2;
  const buckets = new Array(20).fill(0);
  const maxVal = avgBalance * 3;
  const step = maxVal / 20;
  // Simple approximation: generate n samples
  for (let i = 0; i < n; i++) {
    // Box-Muller
    const u1 = Math.random(), u2 = Math.random();
    const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
    const val = Math.exp(mu + sigma * z);
    const bucket = Math.min(19, Math.floor(val / step));
    if (bucket >= 0) buckets[bucket]++;
  }
  return { buckets, labels: buckets.map((_, i) => Math.round(i * step)) };
}
