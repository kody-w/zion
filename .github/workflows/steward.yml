name: ZION Steward (Copilot Autopilot)
on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:
    inputs:
      force_prompt:
        description: 'Force a Copilot prompt even if healthy (for testing)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: zion-steward
  cancel-in-progress: true

jobs:
  steward:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CLI deps
        working-directory: cli
        run: npm install --quiet 2>/dev/null || true

      - name: Run health check
        id: health
        run: |
          chmod +x cli/steward-check.sh
          if bash cli/steward-check.sh > /tmp/health_report.txt 2>&1; then
            echo "healthy=true" >> $GITHUB_OUTPUT
            cat /tmp/health_report.txt
          else
            echo "healthy=false" >> $GITHUB_OUTPUT
            cat /tmp/health_report.txt
            PROMPT=$(sed -n '/---COPILOT-PROMPT---/,$ p' /tmp/health_report.txt | tail -n +2)
            echo "prompt<<EOF" >> $GITHUB_OUTPUT
            echo "$PROMPT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Run evolution check
        id: evolve
        if: steps.health.outputs.healthy == 'true'
        run: |
          chmod +x cli/steward-evolve.sh
          bash cli/steward-evolve.sh > /tmp/evolve_report.txt 2>&1
          cat /tmp/evolve_report.txt
          if grep -q "---EVOLVE-PROMPT---" /tmp/evolve_report.txt; then
            PROMPT=$(sed -n '/---EVOLVE-PROMPT---/,$ p' /tmp/evolve_report.txt | tail -n +2)
            echo "has_task=true" >> $GITHUB_OUTPUT
            echo "prompt<<EOF" >> $GITHUB_OUTPUT
            echo "$PROMPT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_task=false" >> $GITHUB_OUTPUT
            echo "No evolution tasks this cycle."
          fi

      - name: Auto-fix — Re-trigger failed workflows
        if: steps.health.outputs.healthy == 'false'
        run: |
          LOBBY_STATUS=$(gh run list --workflow="lobby-host.yml" --limit 1 --json status -q '.[0].status' 2>/dev/null || echo "unknown")
          if [ "$LOBBY_STATUS" = "completed" ] || [ "$LOBBY_STATUS" = "failure" ] || [ "$LOBBY_STATUS" = "unknown" ]; then
            echo "Re-triggering lobby host..."
            gh workflow run lobby-host.yml --field duration_minutes=330 || true
          fi
          gh run list --limit 5 --json conclusion,databaseId,name -q '.[] | select(.conclusion=="failure")' | while read -r line; do
            RUN_ID=$(echo "$line" | python3 -c "import sys,json; print(json.load(sys.stdin)['databaseId'])")
            echo "Re-running: $RUN_ID"
            gh run rerun "$RUN_ID" --failed || true
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Copilot — Fix health issues
        if: steps.health.outputs.healthy == 'false' && steps.health.outputs.prompt != ''
        run: |
          echo "Health issue detected. Auto-remediation already attempted above."
          echo "Prompt that would be sent to Copilot:"
          echo "${{ steps.health.outputs.prompt }}"
          # Create an issue for manual review if auto-fix wasn't enough
          gh issue create \
            --title "Steward: health issue detected $(date -u +%Y-%m-%d)" \
            --body "The automated steward found issues that need attention:\n\n${{ steps.health.outputs.prompt }}\n\nAuto-remediation was attempted (re-trigger workflows, re-run failures)." \
            --label "steward,automated" 2>/dev/null || echo "Issue creation skipped (may already exist)"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Copilot — Evolve the world
        if: steps.evolve.outputs.has_task == 'true'
        run: |
          echo "Evolution task found for this cycle."
          echo "Prompt:"
          echo "${{ steps.evolve.outputs.prompt }}"
          # Execute evolution directly via script
          bash cli/steward-apply-evolution.sh "${{ steps.evolve.outputs.prompt }}" || true
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Copilot — Manual prompt
        if: github.event.inputs.force_prompt != ''
        run: |
          echo "Manual prompt: ${{ github.event.inputs.force_prompt }}"
        continue-on-error: true

      - name: Log result
        if: always()
        run: |
          echo "=== Steward Run $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
          echo "Healthy: ${{ steps.health.outputs.healthy }}"
          echo "Evolution task: ${{ steps.evolve.outputs.has_task || 'skipped' }}"
