name: Daily World Snapshot

on:
  schedule:
    - cron: '0 0 * * *'  # Midnight UTC daily
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze world state
        run: python3 scripts/world_backup.py freeze

      - name: List snapshots
        run: python3 scripts/world_backup.py list

      - name: Prune old snapshots (keep last 30)
        run: |
          cd state/snapshots
          # Keep .gitkeep, latest.json, previous.json, and the 30 most recent dated snapshots
          ls -1t *.json 2>/dev/null | grep -v latest | grep -v previous | tail -n +31 | while read f; do
            echo "Pruning old snapshot: $f"
            rm "$f"
          done

      - name: Commit snapshot
        run: |
          git config user.name "ZION World Backup"
          git config user.email "noreply@github.com"
          git add state/snapshots/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git rebase --abort 2>/dev/null || true
            git pull --rebase -X theirs origin main || true
            git commit -m "snapshot: daily world state archive $(date -u +%Y-%m-%d)"
            git push origin main
          fi
