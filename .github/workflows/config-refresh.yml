name: Config Refresh

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate config
        run: python3 scripts/generate_config.py

      - name: Commit and push
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "ZION Config Generator"
          git config user.email "zion-bot@users.noreply.github.com"
          git add state/config/
          if git diff --cached --quiet; then
            echo "No config changes to commit."
            exit 0
          fi
          git commit -m "config: refresh world parameters [skip ci]"
          PUSH_OK=false
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase -X theirs origin main 2>/dev/null || true
            if git push origin main; then
              PUSH_OK=true
              break
            fi
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          if [ "$PUSH_OK" = false ]; then
            echo "ERROR: All push attempts failed"
            exit 1
          fi
